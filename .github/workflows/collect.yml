name: collect
on:
  schedule:
    # GitHub 排程常常延遲（10/9 晚了 6 小時），所以多設幾個時間，先到的那個負責紀錄，其他的看到已完成就結束
    - cron: "5 0 * * 1-5"    # 台北 08:05
    - cron: "35 0 * * 1-5"   # 台北 08:35
    - cron: "5 1 * * 1-5"    # 台北 09:05
    - cron: "30 2 * * 1-5"   # 台北 10:30
  workflow_dispatch:
    inputs:
      test:
        description: "測試模式（不等時間、抓兩輪、不存檔）"
        type: boolean
        default: false
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}        # 拿最新版（含當天已存的資料），不要拿排程觸發當下的舊版
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python collect.py ${{ inputs.test && '--test' || '' }}
      - name: 存檔
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data ] || exit 0
          git add data
          git diff --cached --quiet || (git commit -m "data $(TZ=Asia/Taipei date +%F)" && git pull --rebase && git push)
